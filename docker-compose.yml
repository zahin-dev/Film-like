services:
  db:
    image: postgres:16
    container_name: cinemood_db
    environment:
      POSTGRES_USER: cinemood
      POSTGRES_PASSWORD: cinemood
      POSTGRES_DB: cinemood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
