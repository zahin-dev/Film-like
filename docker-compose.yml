name: film-like-mvp-2025-scope
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: film_like_mvp
      POSTGRES_PASSWORD: film_like_mvp
      POSTGRES_DB: film_like_mvp
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "film_like_mvp", "-d", "film_like_mvp"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - mvp_postgres_data:/var/lib/postgresql/data

volumes:
  mvp_postgres_data:
